
version: 2

models:

  - name: customers_t
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: employees_t
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null

  - name: orders_t
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

  - name: order_items_t
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

  - name: stores_t
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null

  - name: products_t
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: price
        data_tests:
          - not_null
